<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>RutaAndina — Pasajero</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
  <div class="navbar">
    <h1>RutaAndina <span class="badge-pais" id="infoUsuario"></span></h1>
    <button class="btn btn-danger btn-sm" onclick="cerrarSesion()">Cerrar Sesión</button>
  </div>

  <div class="container">
    <div class="card">
      <h2>Solicitar Nuevo Viaje <span id="tarifaPreview" style="color: var(--accent); font-size: 1rem;"></span></h2>
      <form id="formViaje">
        <div class="form-grid">
          <div class="form-group">
            <label>Punto de Recojo (Origen):</label>
            <input type="text" id="origen" placeholder="ej. Av. Javier Prado 450" required>
          </div>
          <div class="form-group">
            <label>Destino:</label>
            <input type="text" id="destino" placeholder="ej. Aeropuerto Jorge Chávez" required>
          </div>
          <div class="form-group">
            <label>Categoría:</label>
            <select id="servicio" onchange="actualizarTarifa()">
              <option value="Económico">Económico</option>
              <option value="Confort">Confort</option>
              <option value="XL">XL</option>
            </select>
          </div>
          <div class="form-group">
            <label>Distancia estimada (km):</label>
            <input type="number" id="distancia" value="6" min="1" step="0.5" oninput="actualizarTarifa()" required>
          </div>
        </div>

        <div class="form-group" id="bloqueCorporativo" style="display: none;">
          <label style="color: var(--text-main); cursor: pointer;">
            <input type="checkbox" id="esCorporativo" style="width: auto; margin-right: 8px;">
            Cargar como viaje corporativo a mi empresa
          </label>
        </div>

        <button type="submit" class="btn btn-primary">Confirmar y Pedir Taxi</button>
      </form>

      <div id="mapa"></div>
    </div>

    <div class="card">
      <h2>Mis Viajes y Pagos</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Ruta</th>
              <th>Tarifa</th>
              <th>Modalidad</th>
              <th>Estado</th>
              <th>Pago</th>
              <th>Calificar</th>
            </tr>
          </thead>
          <tbody id="tablaViajes"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Modal de Pago Simulado con QR -->
  <div class="modal-overlay" id="modalPago">
    <div class="modal-box">
      <h3 style="margin-bottom: 6px;">Pago del Viaje <span id="pagoViajeId"></span></h3>
      <p style="color: var(--text-muted); font-size: 0.88rem;">Escanea el código QR o selecciona tu método guardado</p>

      <div class="qr-box">
        <img id="imgQr" src="" alt="QR de Pago" width="160" height="160">
      </div>

      <div style="font-size: 1.4rem; font-weight: 700; color: var(--accent); margin-bottom: 14px;" id="pagoMontoTexto"></div>

      <div class="form-group" style="text-align: left;">
        <label>Método de pago registrado:</label>
        <select id="selectMetodoPago"></select>
      </div>

      <div style="display: flex; gap: 10px; margin-top: 16px;">
        <button class="btn btn-danger" style="flex: 1;" onclick="cerrarModalPago()">Cancelar</button>
        <button class="btn btn-success" style="flex: 1;" onclick="confirmarPago()">Confirmar Pago</button>
      </div>
    </div>
  </div>

  <script src="auth.js"></script>
  <script>
    const user = verificarAcceso('pasajero');
    const paisUsuario = user.pais || 'Perú';
    const monedaUsuario = user.moneda || (paisUsuario.toLowerCase().includes('colombia') ? 'COP' : 'PEN');

    document.getElementById('infoUsuario').textContent = `${user.nombre} · ${paisUsuario} (${monedaUsuario})`;
    if (user.id_empresa) document.getElementById('bloqueCorporativo').style.display = 'block';

    // Inicializar mapa centrado en Lima o Bogotá (OpenStreetMap oficial)
    try {
      const coords = paisUsuario.toLowerCase().includes('colombia')
        ? { centro: [4.6533, -74.0836], origen: [4.6767, -74.0483], destino: [4.7016, -74.1469] }
        : { centro: [-12.0931, -77.0465], origen: [-12.0912, -77.0268], destino: [-12.0247, -77.1120] };

      const map = L.map('mapa').setView(coords.centro, 12);
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap'
      }).addTo(map);
      L.marker(coords.origen).addTo(map).bindPopup('Punto de Recojo');
      L.marker(coords.destino).addTo(map).bindPopup('Destino Estimado');
    } catch (e) {
      console.warn('Mapa no disponible:', e);
    }

    function calcularMonto() {
      const km = parseFloat(document.getElementById('distancia').value) || 1;
      const mult = document.getElementById('servicio').value === 'Confort' ? 1.3 : (document.getElementById('servicio').value === 'XL' ? 1.6 : 1);
      return monedaUsuario === 'COP'
        ? Math.round((8000 + km * 2500) * mult)
        : Number(((6 + km * 2.2) * mult).toFixed(2));
    }

    function actualizarTarifa() {
      document.getElementById('tarifaPreview').textContent = `Tarifa estimada: ${calcularMonto()} ${monedaUsuario}`;
    }
    actualizarTarifa();

    // Solicitar viaje
    document.getElementById('formViaje').addEventListener('submit', async (e) => {
      e.preventDefault();
      const body = {
        id_pasajero: user.id,
        id_empresa: user.id_empresa,
        pais: paisUsuario,
        origen: document.getElementById('origen').value,
        destino: document.getElementById('destino').value,
        distancia: parseFloat(document.getElementById('distancia').value),
        tarifa: calcularMonto(),
        es_corporativo: document.getElementById('esCorporativo').checked
      };

      const res = await fetch('/api/viajes', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });

      if (res.ok) {
        document.getElementById('formViaje').reset();
        actualizarTarifa();
        cargarViajes();
      }
    });

    // Gestión de Modal de Pago QR
    let pagoActual = null;

    async function abrirModalPago(idViaje, monto, moneda) {
      pagoActual = { idViaje, monto, moneda };
      document.getElementById('pagoViajeId').textContent = `#${idViaje}`;
      document.getElementById('pagoMontoTexto').textContent = `${monto} ${moneda}`;
      document.getElementById('imgQr').src = `https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=RutaAndina-Viaje-${idViaje}-${monto}-${moneda}`;

      const res = await fetch(`/api/pasajeros/${user.id}/metodos-pago`);
      const metodos = await res.json();
      const select = document.getElementById('selectMetodoPago');
      select.innerHTML = metodos.map(m => `<option value="${m.idMetodoPago}">${m.tipoPago}</option>`).join('');

      document.getElementById('modalPago').style.display = 'flex';
    }

    function cerrarModalPago() {
      document.getElementById('modalPago').style.display = 'none';
    }

    async function confirmarPago() {
      const idMetodoPago = document.getElementById('selectMetodoPago').value;
      const res = await fetch('/api/pagos', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          id_viaje: pagoActual.idViaje,
          id_metodo_pago: idMetodoPago,
          moneda: pagoActual.moneda,
          monto: pagoActual.monto
        })
      });

      const data = await res.json();
      alert(data.mensaje || data.error);
      cerrarModalPago();
      cargarViajes();
    }

    async function calificar(idViaje, puntaje) {
      await fetch(`/api/viajes/${idViaje}/calificar`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ puntaje, emisor: 'PASAJERO' })
      });
      cargarViajes();
    }

    async function cargarViajes() {
      const res = await fetch(`/api/viajes/pasajero/${user.id}`);
      const viajes = await res.json();
      const tbody = document.getElementById('tablaViajes');
      tbody.innerHTML = '';

      viajes.forEach(v => {
        const claseEstado = v.estado.replace(' ', '-');

        let colPago = '—';
        if (v.es_corporativo) {
          colPago = '<span style="color: var(--text-muted); font-size: 0.8rem;">Factura Empresa</span>';
        } else if (v.estado_pago) {
          colPago = `<span style="color: var(--green); font-weight: 600;">${v.estado_pago}</span>`;
        } else if (v.estado === 'finalizado') {
          colPago = `<button class="btn btn-primary btn-sm" onclick="abrirModalPago(${v.id_viaje}, ${v.tarifa}, '${v.moneda}')">Pagar QR</button>`;
        }

        let colCalif = '—';
        if (v.estado === 'finalizado') {
          colCalif = v.calificacion
            ? `★ ${v.calificacion}/5`
            : `<select onchange="calificar(${v.id_viaje}, this.value)" style="width:auto; padding:4px 8px;">
                 <option value="">Puntúa</option>
                 <option value="5">5 ★</option>
                 <option value="4">4 ★</option>
                 <option value="3">3 ★</option>
               </select>`;
        }

        tbody.innerHTML += `
          <tr>
            <td>#${v.id_viaje}</td>
            <td>${v.origen} → ${v.destino}</td>
            <td><strong>${v.tarifa} ${v.moneda}</strong></td>
            <td>${v.es_corporativo ? 'Corporativo' : 'Personal'}</td>
            <td><span class="estado ${claseEstado}">${v.estado}</span></td>
            <td>${colPago}</td>
            <td>${colCalif}</td>
          </tr>`;
      });
    }

    cargarViajes();
  </script>
</body>
</html>
